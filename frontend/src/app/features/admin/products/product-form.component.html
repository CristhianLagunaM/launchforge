<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>{{ product ? 'Editar producto' : 'Crear producto' }}</mat-card-title>
    <mat-card-subtitle>Los cambios escriben contra el backend real y validan SKU, slug y categoría.</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>SKU</mat-label>
        <input matInput formControlName="sku" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Slug</mat-label>
        <input matInput formControlName="slug" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option [value]="0" disabled>Selecciona una categoría</mat-option>
          @for (category of categories; track category.id) {
            <mat-option [value]="category.id">{{ category.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput rows="5" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Precio</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="price" />
      </mat-form-field>

      <div class="actions">
        @if (product) {
          <button mat-button type="button" (click)="cancelEdit.emit()">Cancelar</button>
        }
        <button mat-flat-button color="primary" type="submit" [disabled]="saving">
          {{ product ? 'Guardar cambios' : 'Crear producto' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
