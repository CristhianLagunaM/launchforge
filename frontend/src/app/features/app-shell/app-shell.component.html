<mat-toolbar class="shell-toolbar">
  <div class="brand">
    <mat-icon>rocket_launch</mat-icon>
    <div>
      <strong>LaunchForge</strong>
      <small>Authentication & Authorization</small>
    </div>
  </div>

  <nav class="shell-nav">
    <a mat-button routerLink="/app" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a mat-button routerLink="/app/admin" routerLinkActive="active-link">Admin</a>
  </nav>

  <div class="shell-user">
    <span>{{ authStore.displayName() }}</span>
    <button mat-stroked-button type="button" (click)="authStore.logout()">Salir</button>
  </div>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
