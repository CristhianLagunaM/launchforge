spring:
  application:
    name: launchforge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/launchforge}
    username: ${SPRING_DATASOURCE_USERNAME:launchforge}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-} userId:%X{userId:-} path:%X{requestPath:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

launchforge:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-local-only-change-me-local-only}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
